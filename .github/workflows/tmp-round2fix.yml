name: tmp-round2fix
on:
  push:
    paths:
      - ".buildtmp/round2fix/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patches
        run: |
          set -e
          patch -p1 --verbose < .buildtmp/round2fix/report_fix.patch
          patch -p1 --verbose < .buildtmp/round2fix/other6.patch

      - name: Remove temp files and this workflow
        run: |
          set -e
          git rm -rf .buildtmp/round2fix
          git rm -f .github/workflows/tmp-round2fix.yml

      - name: Commit and push
        run: |
          set -e
          git config user.name "airex-round2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair Report.tsx full-width-paren corruption and apply Round 2 changes (temp workflow self-clean)"
          git push origin HEAD:main
