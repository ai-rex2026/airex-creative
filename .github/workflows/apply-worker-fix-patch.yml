name: Apply worker-fix patch
on:
  push:
    paths:
      - '.buildtmp/worker-fix/GO2.marker'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove leftover files and self
        run: |
          git config user.name "ai-rex-bot"
          git config user.email "bot@ai-rex2026.local"
          git rm -r --cached --ignore-unmatch .buildtmp/worker-fix
          rm -rf .buildtmp/worker-fix
          rm -f .github/workflows/apply-worker-fix-patch.yml
          git add -A
          git commit -m "chore: worker-fix の一時ファイルを掃除"
          git push
