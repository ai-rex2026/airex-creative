name: Apply apify-social-posts patch
on:
  push:
    paths:
      - '.buildtmp/apify-social-posts/GO.marker'
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: git apply --whitespace=nowarn .buildtmp/apify-social-posts/report.patch
      - name: Commit and push
        run: |
          git config user.name "ai-rex-bot"
          git config user.email "bot@ai-rex2026.local"
          git rm -r --cached .buildtmp/apify-social-posts >/dev/null
          rm -rf .buildtmp/apify-social-posts
          rm -f .github/workflows/apply-apify-social-posts-patch.yml
          git add -A
          git commit -m "feat: SNS投稿の実測エンゲージメント表示を追加（apify-social-posts patch適用）"
          git push
