name: tmp-apply-stores
on:
  push:
    paths:
      - ".github/workflows/tmp-apply-stores.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transform, apply staged patches and verify hashes
        run: |
          set -e
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          sh .buildtmp/stores/transform.sh
          for p in .buildtmp/stores/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          grep -v -e ' Docs/sql/2026-10-09-stores.sql$' -e ' app/meo-actions.ts$' .buildtmp/stores/SHA256SUMS | cat - .buildtmp/stores/SHA256SUMS.fix > /tmp/sums
          wc -l /tmp/sums
          sha256sum -c /tmp/sums
          rm -rf .buildtmp/stores
          rm -f .github/workflows/tmp-apply-stores.yml
          rmdir .buildtmp 2>/dev/null || true
          git add -A
          git commit -m "feat(stores): 店舗をレポートから独立した実体にする（MEO運用は /stores 基準）

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
