name: apply-pubads-proposals-1006r
on:
  push:
    paths:
      - '.github/workflows/apply-pubads-proposals-1006r.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate chunks, decode, gunzip and apply patch
        run: |
          cat .buildtmp/pubads-proposals-1006r/chunks/chunk-*.b64 | tr -d '\n' > /tmp/combined.b64
          base64 -d /tmp/combined.b64 | gunzip > /tmp/combined.patch
          echo "f68a4acf7b3ec6c4b96885a83a584d92dfc82b5dcf50c3642ef4d731a0319435  /tmp/combined.patch" | sha256sum -c -
          git apply --check /tmp/combined.patch
          git apply /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git add -A -- . ':!.buildtmp' ':!.github/workflows/apply-pubads-proposals-1006r.yml'
          git commit \
            -m "feat: 出稿中の広告を同じ素材でまとめて各5件に・画像動画の制作案を追加（1006r）" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"

      - name: Remove staging files and this workflow
        run: |
          git rm -r -q .buildtmp
          git rm -q .github/workflows/apply-pubads-proposals-1006r.yml
          git commit -m "chore: remove temporary push-apply workflow and staging files"

      - name: Push to main
        run: git push origin HEAD:main
