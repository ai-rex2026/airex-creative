name: apply-summary-tab-patch
on:
  push:
    paths:
      - '.buildtmp/summary-tab/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply chunked patch files in order
        run: |
          set -e
          cd .buildtmp/summary-tab
          : > /tmp/combined.patch
          for f in $(cat _order.txt); do
            cat "$f" >> /tmp/combined.patch
          done
          cd "$GITHUB_WORKSPACE"
          git apply --whitespace=nowarn /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "ai-rex2026-bot"
          git config user.email "noreply@ai-rex2026.local"
          git add -A
          git add -u
          git commit -m "feat: summary-tab patch applied via temp workflow"

      - name: Remove staging files and this workflow (self-delete)
        run: |
          git rm -r .buildtmp/summary-tab
          git rm .github/workflows/apply-summary-tab-patch.yml
          git commit -m "chore: remove summary-tab staging files and temp workflow"

      - name: Push
        run: git push origin HEAD:main
