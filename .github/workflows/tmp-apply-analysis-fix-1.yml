name: tmp-apply-analysis-fix-1
on:
  push:
    paths:
      - '.buildtmp/analysis-fix-1/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: git apply --whitespace=nowarn .buildtmp/analysis-fix-1/fix.patch

      - name: Remove temp files (patch, marker, this workflow)
        run: |
          rm -f .buildtmp/analysis-fix-1/fix.patch
          rm -f .buildtmp/analysis-fix-1/GO.marker
          rmdir .buildtmp/analysis-fix-1 2>/dev/null || true
          rm -f .github/workflows/tmp-apply-analysis-fix-1.yml

      - name: Commit and push
        run: |
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git add -A
          git commit -m "fix: lib/analysis.ts のUTF-8破損文字を修正 (自動適用・自己削除ワークフロー)"
          git push
