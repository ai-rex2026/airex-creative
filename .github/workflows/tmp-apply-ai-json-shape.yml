name: tmp-apply-ai-json-shape
on:
  push:
    branches: [main]
    paths:
      - ".buildtmp/ai-json-shape/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git diff --quiet 838d4ed30f0a2ecdd3669cc01aa3ca6c85a41a6a HEAD -- lib/anthropic.ts
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/588348910" -o /tmp/p.tgz
          echo "0648ce3a433c1d2450f8dbd7e23aab2c44d575a959e433246c62216d5eb119ad  /tmp/p.tgz" | sha256sum -c -
          tar xzf /tmp/p.tgz
          rm -rf .buildtmp/ai-json-shape
          rm -f .github/workflows/tmp-apply-ai-json-shape.yml
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git add -A
          git commit -m "fix(ai): AIの出力JSONの外枠が指示とずれたときに合わせて、中身が空になるのを防ぐ" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01RCmd7iHQujmUyDk3RoypTT"
          git push origin HEAD:main
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/396598289" || true
