name: tmp-apply-pf2
on:
  push:
    paths:
      - ".github/workflows/tmp-apply-pf2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patches and verify hash
        run: |
          set -e
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          for p in .buildtmp/pf2/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          sha256sum -c .buildtmp/pf2/SHA256SUMS
          rm -rf .buildtmp/pf2
          rm -f .github/workflows/tmp-apply-pf2.yml
          rmdir .buildtmp 2>/dev/null || true
          git add -A
          git commit -m "fix(meo): 説明文の材料からレポートのサイト説明を外し、設定画面の入口をMEO分析（店舗紐付け済み優先）に限定

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
