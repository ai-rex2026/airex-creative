name: apply-summary-ledger-1005m
on:
  push:
    paths:
      - '.github/workflows/apply-summary-ledger-1005m.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate chunks, decode, gunzip and apply patch
        run: |
          cat .buildtmp/summary-ledger-1005m/chunks/chunk-*.b64 | tr -d '\n' > /tmp/combined.b64
          base64 -d /tmp/combined.b64 | gunzip > /tmp/combined.patch
          echo "0205c071e2aac4f630b22f2d1f55f0939322ce6a87d36783acd376ed6a002cc7  /tmp/combined.patch" | sha256sum -c -
          git apply --check /tmp/combined.patch
          git apply /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git add -A -- . ':!.buildtmp' ':!.github/workflows/apply-summary-ledger-1005m.yml'
          git commit \
            -m "feat: サマリーの施策を分析データタブの打ち手から組む（1005m）" \
            -m "分析データの各章の打ち手を台帳にし（lib/measure-sources.ts）、AIは台帳から選んでまとめる。台帳外は2件まで。各施策に元の章へのリンク。AI失敗時は台帳からカテゴリごとに1件ずつ施策化。計測タグ章で未導入を確認できたタグの施策は出す。" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"

      - name: Remove staging files and this workflow
        run: |
          git rm -r -q .buildtmp
          git rm -q .github/workflows/apply-summary-ledger-1005m.yml
          git commit -m "chore: remove temporary push-apply workflow and staging files"

      - name: Push to main
        run: git push origin HEAD:main
