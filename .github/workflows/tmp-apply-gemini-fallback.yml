name: tmp-apply-gemini-fallback
on:
  push:
    branches: [main]
    paths:
      - ".buildtmp/gemini-fallback/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git diff --quiet 7f7a13f4693c2c811fc9370505918bc279a57ab5 HEAD -- lib/ai-context.ts lib/analysis.ts lib/anthropic.ts lib/competitors.ts lib/gemini.ts lib/social-competitors.ts
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/588259870" -o /tmp/p.tgz
          echo "a6359815e70f199a79c7af7fd732e9394fead9a9960840cca12b2c915e1e80fa  /tmp/p.tgz" | sha256sum -c -
          tar xzf /tmp/p.tgz
          rm -rf .buildtmp/gemini-fallback
          rm -f .github/workflows/tmp-apply-gemini-fallback.yml
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git add -A
          git commit -m "fix(ai): Geminiが残高切れ・上限などで使えないときはClaudeで作り切る" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01RCmd7iHQujmUyDk3RoypTT"
          git push origin HEAD:main
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/396563777" || true
