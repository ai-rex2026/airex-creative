name: tmp-apply-st1
on:
  push:
    paths:
      - ".github/workflows/tmp-apply-st1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch and verify hash
        run: |
          set -e
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          for p in .buildtmp/st1/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          sha256sum -c .buildtmp/st1/SHA256SUMS
          rm -rf .buildtmp/st1
          rm -f .github/workflows/tmp-apply-st1.yml
          rmdir .buildtmp 2>/dev/null || true
          git add -A
          git commit -m "fix(settings): MEO入口で店舗紐付け済みのレポート分析も対象にする

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
