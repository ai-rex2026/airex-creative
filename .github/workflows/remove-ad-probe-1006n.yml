name: remove-ad-probe-1006n
on:
  push:
    paths:
      - '.github/workflows/remove-ad-probe-1006n.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove the temporary route and this workflow
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git rm -q app/api/dev/ad-probe/route.ts
          git rm -q .github/workflows/remove-ad-probe-1006n.yml
          git commit \
            -m "chore: 試験用の一時ルート（公開情報の広告取得）を削除" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
