name: apply-report-fixes-1005d
on:
  push:
    paths:
      - '.buildtmp/report-fixes-1005d/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate chunks, decode, gunzip and apply patch
        run: |
          cat .buildtmp/report-fixes-1005d/chunks/chunk-*.b64 | tr -d '\n' > /tmp/combined.b64
          wc -c /tmp/combined.b64
          base64 -d /tmp/combined.b64 | gunzip > /tmp/combined.patch
          wc -c /tmp/combined.patch
          git apply --check /tmp/combined.patch
          git apply /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git add -A -- . ':!.buildtmp' ':!.github/workflows/apply-report-fixes-1005d.yml'
          git commit \
            -m "fix: レポート再確認（2回目）の不具合修正（TikTok重複取得・サジェスト・計測施策・Facebook分析・バッジ）" \
            -m "SNS投稿の絵文字が途中で切れてDB保存が拒否され、取得が毎回やり直されApify上限に達していた問題を修正（保存の段階的フォールバックと4回での打ち切り）。指名検索サジェストのGoogle再試行・Bingフォールバック・取得経過の表示、計測タグ施策は未設置が確認できた場合のみ表示、Facebookの分析結果・運用プランの生成、実データバッジの各セクション展開。" \
            -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"

      - name: Remove staging files and this workflow
        run: |
          git rm -r .buildtmp
          git rm .github/workflows/apply-report-fixes-1005d.yml
          git commit -m "chore: remove temporary push-apply workflow and staging files"

      - name: Push to main
        run: git push origin HEAD:main
