name: apply-speed-unverified-1005n
on:
  push:
    paths:
      - '.github/workflows/apply-speed-unverified-1005n.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate chunks, decode, gunzip and apply patch
        run: |
          cat .buildtmp/speed-unverified-1005n/chunks/chunk-*.b64 | tr -d '\n' > /tmp/combined.b64
          base64 -d /tmp/combined.b64 | gunzip > /tmp/combined.patch
          echo "020408caabcae7bd1cc315579d954544cf5c67a45e1c04523e3d0023c988b09e  /tmp/combined.patch" | sha256sum -c -
          git apply --check /tmp/combined.patch
          git apply /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git add -A -- . ':!.buildtmp' ':!.github/workflows/apply-speed-unverified-1005n.yml'
          git commit \
            -m "fix: 表示速度を専用の計測で確実に取る・施策のリンク先と未確認の注記・実施済みボタン（1005n）" \
            -m "表示速度：分析開始直後から専用の関数で並行計測（最大4回・1回最大270秒）、PSIは時間差で2本並行、全滅時はCrUXの実ユーザー値で補う。施策：表示速度の打ち手は表示速度の欄へリンク、実施状況を確かめられない施策に「（もし未実施であれば）」、「やった」→「実施済み」。" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"

      - name: Remove staging files and this workflow
        run: |
          git rm -r -q .buildtmp
          git rm -q .github/workflows/apply-speed-unverified-1005n.yml
          git commit -m "chore: remove temporary push-apply workflow and staging files"

      - name: Push to main
        run: git push origin HEAD:main
