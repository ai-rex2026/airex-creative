name: apply-aioovref
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-aioovref.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          D=.buildtmp/aioovref
          cat $D/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/patch.diff
          sha256sum -c $D/patch.sha256
          git apply /tmp/patch.diff
          git rm -r -q .buildtmp/aioovref .github/workflows/apply-aioovref.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git add -A
          git commit -q -m "AIO：AI による概要の出典 google.com をビジネスプロフィールと転送リンクに分け、転送リンクは同じ検索結果のタイトルで実際のサイトに置き換える。自社の出典をタイトルでも照合" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
