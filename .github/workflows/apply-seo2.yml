name: apply-seo2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-seo2.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          cat .buildtmp/seo2/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.diff
          echo "9473e879fef487c4f76bc330526ce0a3f9fbf575c9945446e20d8a4f8ec08f24  /tmp/p.diff" | sha256sum -c -
          git apply /tmp/p.diff
          git rm -rq .buildtmp/seo2 .github/workflows/apply-seo2.yml
          git add -A
          git config user.name "suzuki"
          git config user.email "suzuki.yuichiro.libertad@gmail.com"
          git commit -q -F - <<'MSG'
          SEO運用に対策キーワードを追加

          - 全体レポートの対策キーワード・SEO記事設計から取り込み、書く先（自社／サテライト／既存ページ）と状態を管理
          - Search Console の直近28日を反映して順位の推移を表示。表示はあるのに11位以下の語を候補に
          - 月間検索数は AI の推定（5段階）。実測の表示が推定より多い語に印
          - 記事を語に結び付け、公開で「公開済み」。1語に記事が2本以上なら警告。伸び悩む語に決まった型の改善案

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy
          MSG
          git push origin HEAD:main
