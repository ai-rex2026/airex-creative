name: apply-worker-patch7

on:
  push:
    paths:
      - '.buildtmp/worker7/GO.marker'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode escaped patch
        run: python3 -c "import json,pathlib; p=pathlib.Path('.buildtmp/worker7/escaped_p7_worker.txt'); pathlib.Path('.buildtmp/worker7/p7-worker.patch').write_text(json.loads(p.read_text(encoding='utf-8')), encoding='utf-8')"

      - name: Apply patch
        run: git apply --whitespace=nowarn .buildtmp/worker7/p7-worker.patch

      - name: Commit and push patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/worker.ts
          git commit -m "fix: 速度計測の工程に差し掛かる前に、同じバーストの2周目以降なら事前に次のバーストに引き渡す。速度計測が常にフル予算で実行されるようにしてタイムアウトリスクを減らす"
          git push

      - name: Clean up temporary workflow files
        run: |
          rm -f .github/workflows/apply-worker-patch7.yml
          rm -rf .buildtmp/worker7
          git add -A
          git commit -m "chore: remove temp workflow"
          git push
