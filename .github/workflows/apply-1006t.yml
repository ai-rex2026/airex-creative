name: apply-1006t
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-1006t.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/1006t/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/p.patch
          echo 'ce80a3499d3ae267d1a4a34d3b7ef65041f8ac52844c1ef1484de5b64218f3c5  /tmp/p.patch' | sha256sum -c -
          git apply /tmp/p.patch
          git rm -rq .buildtmp .github/workflows/apply-1006t.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -F - <<'MSG'
          feat(report): 出稿中の広告（公開情報）・広告の実績分析に実データバッジ（RealBadge を共通化）

          chore: remove temporary push-apply workflow and staging files

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy
          MSG
          git push origin HEAD:main
