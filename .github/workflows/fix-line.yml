name: fix-line

on:
  push:
    paths:
      - '.buildtmp/fixline.marker'

permissions:
  contents: write

jobs:
  fixline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix parenthesis style on line 1835 and clean up
        run: |
          set -e
          python3 - <<'PYEOF'
          path = "components/Report.tsx"
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()
          old = "                // AIの文字チェックに回らなかった画像（判定件数の上限などで対象外になったもの）。\n"
          new = "                // AIの文字チェックに回らなかった画像(判定件数の上限などで対象外になったもの)。\n"
          idx = lines.index(old)
          lines[idx] = new
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          print("patched line", idx + 1)
          PYEOF
          wc -c components/Report.tsx
          rm -f .buildtmp/fixline.marker
          rmdir .buildtmp 2>/dev/null || true
          rm -f .github/workflows/fix-line.yml

      - name: Commit and push
        run: |
          set -e
          git config user.name "repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct parenthesis style on Report.tsx line 1835 (automated)

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push origin HEAD:main
