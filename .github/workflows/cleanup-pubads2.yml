name: cleanup-pubads2
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-pubads2.yml"]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: clean
        run: |
          set -e
          git rm -r -q .buildtmp .github/workflows/cleanup-pubads2.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "一時ファイル（差分）を消す" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
