name: tmp-apply-rf
on:
  push:
    paths:
      - '.github/workflows/tmp-apply-rf.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches
        run: |
          set -e
          for n in 1 2; do git apply --verbose .buildtmp/rf/patches/$n.patch; done
      - name: Verify hashes
        run: sha256sum -c .buildtmp/rf/SHA256SUMS
      - name: Cleanup and push
        run: |
          set -e
          git rm -rq .buildtmp/rf
          git rm -q .github/workflows/tmp-apply-rf.yml
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "fix(meo): show an updating notice while the list reloads after save, publish and cancel" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
