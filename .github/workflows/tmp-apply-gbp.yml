name: tmp-apply-gbp
on:
  push:
    paths:
      - ".github/workflows/tmp-apply-gbp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged files and verify hashes
        run: |
          set -e
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          cp -r .buildtmp/gbp/files/. .
          for p in .buildtmp/gbp/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          # 1文字でも違えばここで止まり、コミットされない
          sha256sum -c .buildtmp/gbp/SHA256SUMS
          rm -rf .buildtmp/gbp
          rm -f .github/workflows/tmp-apply-gbp.yml .github/workflows/tmp-apply-inputs-connect.yml
          rmdir .buildtmp 2>/dev/null || true
          git add -A
          git commit -m "feat(meo): Googleビジネスプロフィール連携（読み取りのみ）と設定画面のMEO運用ページ入口

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
