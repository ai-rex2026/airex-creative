name: apply-aioqueue
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-aioqueue.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          D=.buildtmp/aioqueue
          cat $D/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/patch.diff
          sha256sum -c $D/patch.sha256
          git apply /tmp/patch.diff
          git rm -r -q .buildtmp/aioqueue .github/workflows/apply-aioqueue.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git add -A
          git commit -q -m "AIO：実測と概要を同時に並べて回し（cron 5分おき）、止まった実測は始めてから6分で失敗に。画面は取得中20秒おきに読み直し、順番待ちと確認中を分ける" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
