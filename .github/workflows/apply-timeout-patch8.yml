name: apply-timeout-patch8
on:
  push:
    paths:
      - '.buildtmp/timeout8/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          python3 -c "import json, pathlib; p = pathlib.Path('.buildtmp/timeout8/escaped_p8.txt'); content = json.loads(p.read_text(encoding='ascii')); pathlib.Path('.buildtmp/timeout8/patch8.diff').write_text(content, encoding='utf-8')"
          git apply --whitespace=nowarn .buildtmp/timeout8/patch8.diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/anthropic.ts lib/worker.ts
          git commit -m "fix: askJsonの初回+リトライ合計タイムアウトとworker.tsの重い工程ハンドオフを一般化
          - lib/anthropic.ts: askJson/askJsonWithImagesが初回とリトライで同じtimeoutMsを共有していたため、呼び出し元がtimeoutMsを長めに指定していると(lib/ad-ops.tsのfinishAdOps: 170秒)初回+リトライの合計が最悪340秒となり、サーバーレス関数の実行上限(300秒)を単体で超えていた。TOTAL_BUDGET_MSベースの配分(askJson: 260秒, askJsonWithImages: 220秒)に変更し、どの呼び出し元のtimeoutMs指定でも合計が安全マージン付きで上限内に収まるようにした。
          - lib/worker.ts: processAnalysis()の速度計測専用のバースト引き渡し判定(stepCount>0 + DBピーク)を、工程名に依存しない一般的なルールに置き換えた。各tick()の実際の所要時間を計測し、閾値(5秒)を超えた工程の直後は常に次のバーストへ引き渡す。これにより速度計測だけでなく askJson を呼ぶ全てのAI生成工程でも同じ保護が自動的に効き、軽い工程は同バーストで連鎖して処理時間を最短化する。

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main

      - name: Remove temp workflow and buildtmp
        run: |
          git rm -r .github/workflows/apply-timeout-patch8.yml .buildtmp/timeout8
          git commit -m "chore: remove temp workflow (apply-timeout-patch8)

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
