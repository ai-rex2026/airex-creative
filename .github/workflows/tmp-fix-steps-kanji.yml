name: tmp fix steps kanji
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-fix-steps-kanji.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replace mistyped kanji and remove this workflow
        run: |
          set -e
          python3 - <<'PY'
          p = 'lib/meo-ops/kit/steps.ts'
          s = open(p, encoding='utf-8').read()
          bad = '（呄'
          good = '（各'
          n = s.count(bad)
          print('found', n)
          assert n == 2, n
          open(p, 'w', encoding='utf-8').write(s.replace(bad, good))
          PY
          git rm -q .github/workflows/tmp-fix-steps-kanji.yml
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          git add lib/meo-ops/kit/steps.ts
          git commit -q -m 'fix(meo): steps.ts の転記ずれ2文字を直す（一時ワークフローは削除）'
          git push
