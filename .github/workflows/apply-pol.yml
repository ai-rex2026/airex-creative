name: apply-pol
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-pol.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/pol/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "8e821bf5545d38fc4212293b7b8a7fce4ace8679a985733e13d2854daf2dec52  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/pol .github/workflows/apply-pol.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "AIO note記事：AIっぽさを消す8工程の推敲を書いた直後にかける（体験の金額・失敗は事実が無ければ【要記入】）" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
