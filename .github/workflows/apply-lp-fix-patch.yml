name: apply-lp-fix-patch
on:
  push:
    paths:
      - ".buildtmp/lp-fix/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          git apply --whitespace=nowarn .buildtmp/lp-fix/report.patch

      - name: Commit and push patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/Report.tsx
          git commit -m "fix(report): LP生成非表示化でTSのnullナローイングが崩れる問題を修正（false&&→booleanconst）"
          git push

      - name: Remove temporary workflow and buildtmp files
        run: |
          git rm -f .github/workflows/apply-lp-fix-patch.yml
          git rm -rf .buildtmp/lp-fix
          git commit -m "chore: 一時ワークフローを削除"
          git push
