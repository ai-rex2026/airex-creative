name: apply-aiolatest
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-aiolatest.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          D=.buildtmp/aiolatest
          cat $D/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/patch.diff
          sha256sum -c $D/patch.sha256
          git apply /tmp/patch.diff
          git rm -r -q .buildtmp/aiolatest .github/workflows/apply-aiolatest.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git add -A
          git commit -q -m "AIO：同じ月に測り直したときはプロンプトごとに最後の1回だけを集計する（Gemini・Google の概要とも）" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
