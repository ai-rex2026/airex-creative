name: apply-worker-patch9
on:
  push:
    paths:
      - '.buildtmp/worker9/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          python3 -c "import json, pathlib; p = pathlib.Path('.buildtmp/worker9/escaped_p9.txt'); content = json.loads(p.read_text(encoding='utf-8')); pathlib.Path('.buildtmp/worker9/patch9.diff').write_text(content, encoding='utf-8')"
          git apply --whitespace=nowarn .buildtmp/worker9/patch9.diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/worker.ts
          git commit -m "fix: バースト引き渡しを工程の所要時間ではなく残り予算ベースに変更し、不要な引き渡しを減らす

          直前の修正(ece828c)は全工程の所要時間を計測し5秒を超えたら即次バーストへ引き渡す設計にしたが、askJsonを呼ぶ工程はほぼ全て5秒を超えるため実質ほぼ全工程の直後で引き渡しが発生し、分析全体の処理時間を伸ばしてしまう問題があった。残り予算(deadline - now)がLOW_BUDGET_MS(90秒)を下回った時だけ次バーストへ引き渡す設計に変更し、残り予算が十分な間は工程をそのまま同じバーストで連鎖させる。これにより既存の処理時間を伸ばさずに、バーストの終盤でタイムアウトに近づくリスクだけを防ぐ。

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main

      - name: Remove temp workflow and buildtmp
        run: |
          git rm -r .github/workflows/apply-worker-patch9.yml .buildtmp/worker9
          git commit -m "chore: remove temp workflow (apply-worker-patch9)

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
