name: tmp-apply-meo-phase1
on:
  push:
    branches: [main]
    paths:
      - ".buildtmp/meo-phase1/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 変更対象の既存ファイルが作業時点(160b3c9)から動いていないことを確認（動いていたら上書きしない）
          git diff --quiet 160b3c90f4f9256020d9b5ae270d10690ed9636a HEAD -- components/Report.tsx components/MeoReport.tsx "app/analysis/[id]/report/page.tsx" vercel.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/587896445" -o /tmp/p.tgz
          echo "e12633487df66b2d08d4c10611c004f56c277b5fea5107525742cda67dd61879  /tmp/p.tgz" | sha256sum -c -
          tar xzf /tmp/p.tgz
          rm -rf .buildtmp/meo-phase1
          rm -f .github/workflows/tmp-apply-meo-phase1.yml
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git add -A
          git commit -m "feat(meo): AI-REX本体のMEO運用ワークスペースを移植（フェーズ1）" \
            -m "店舗の特定・ホーム・クチコミ・投稿・プロフィール・写真・分析・AI検索・設定の8タブ、日次スナップショット、AI検索（Claude web検索）を追加。GBP連携はフェーズ2。" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01RCmd7iHQujmUyDk3RoypTT"
          git push origin HEAD:main
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/396434956" || true
