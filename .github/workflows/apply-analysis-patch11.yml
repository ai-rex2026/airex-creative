name: apply-analysis-patch11
on:
  push:
    paths:
      - '.buildtmp/analysis11/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          python3 -c "import json, pathlib; p = pathlib.Path('.buildtmp/analysis11/escaped_p11.txt'); content = json.loads(p.read_text(encoding='utf-8')); pathlib.Path('.buildtmp/analysis11/patch11.diff').write_text(content, encoding='utf-8')"
          git apply --whitespace=nowarn .buildtmp/analysis11/patch11.diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/analysis.ts
          git commit -m "fix: wave2バッチのoutreachジョブでa.suggestsのnull許容型エラーを修正

          patch10のビルドでTS2308相当(SuggestScan|nullをSuggestScanへ渡せない)が発生していた。
          gateでa.suggestsの非 nullは保証済みだが、クロージャ内では絞り込みが保持されないため、
          diagnosis/kpi/copiesと同様にローカル変数suggestsへ受けてから渡すよう修正する。

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main

      - name: Remove temp workflow and buildtmp
        run: |
          git rm -r .github/workflows/apply-analysis-patch11.yml .buildtmp/analysis11
          git commit -m "chore: remove temp workflow (apply-analysis-patch11)

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
