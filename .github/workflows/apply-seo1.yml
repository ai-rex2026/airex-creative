name: apply-seo1
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-seo1.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          cat .buildtmp/seo1/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.diff
          echo "a84c4fd816b95cea8692c74c63123d50ad107b1dffe98b0e131413a949f1d787  /tmp/p.diff" | sha256sum -c -
          git apply /tmp/p.diff
          git rm -rq .buildtmp/seo1 .github/workflows/apply-seo1.yml
          git add -A
          git config user.name "suzuki"
          git config user.email "suzuki.yuichiro.libertad@gmail.com"
          git commit -q -F - <<'MSG'
          SEO運用を新設（自社サイト記事の移設・サテライトサイト・内部対策）

          - /seo：AIO と同じ対象で、自社サイト記事／サテライトサイト／内部対策／効果と改善
          - サテライトサイト：別の WordPress 連携、扱う商品の事実だけで書く比較・解説記事、公開時に運営者・PR 表記と rel=sponsored をコードで付与
          - 内部対策：SEO と AIO で共通のリスト。サイト・robots.txt・llms.txt の読み取りと URL レポートから洗い出し（AI なし）
          - AIO のタブを note／PR TIMES／内部対策／効果と改善／AIでの見え方に。左メニューに SEO運用

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy
          MSG
          git push origin HEAD:main
