name: tmp-apply-ar2
on:
  push:
    paths:
      - '.github/workflows/tmp-apply-ar2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches
        run: |
          set -e
          for n in 1 2 3; do git apply --verbose .buildtmp/ar2/patches/$n.patch; done
      - name: Verify hashes
        run: sha256sum -c .buildtmp/ar2/SHA256SUMS
      - name: Cleanup and push
        run: |
          set -e
          git rm -rq .buildtmp/ar2
          git rm -q .github/workflows/tmp-apply-ar2.yml
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "feat(meo): remove store delete feature, keep rename" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
