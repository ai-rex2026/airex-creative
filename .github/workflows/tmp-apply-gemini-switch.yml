name: tmp-apply-gemini-switch
on:
  push:
    branches: [main]
    paths:
      - ".buildtmp/gemini-switch/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download, verify and apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git diff --quiet 3531da8e3a5c870e3e3118b1167a61a1e2e1f990 HEAD -- app/report-extra-actions.ts lib/analysis.ts lib/anthropic.ts lib/competitors.ts lib/social-competitors.ts
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/588223141" -o /tmp/p.tgz
          echo "479ac39cfabb5dfb022a9ce01f38c9d267591f4a6c4156b8bb3970008b9cb1a9  /tmp/p.tgz" | sha256sum -c -
          tar xzf /tmp/p.tgz
          rm -rf .buildtmp/gemini-switch
          rm -f .github/workflows/tmp-apply-gemini-switch.yml
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git add -A
          git commit -m "feat(ai): 連携がひとつも無いレポートをGemini 3.1 Flash-Liteで作る切替と、レポートごとのAI利用量・費用の記録" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01RCmd7iHQujmUyDk3RoypTT"
          git push origin HEAD:main
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/396549971" || true
