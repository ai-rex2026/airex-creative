name: tmp-apply-pb
on:
  push:
    paths:
      - '.github/workflows/tmp-apply-pb.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches
        run: |
          set -e
          for n in 1 2 3 4; do git apply --verbose .buildtmp/pb/patches/$n.patch; done
      - name: Verify hashes
        run: sha256sum -c .buildtmp/pb/SHA256SUMS
      - name: Cleanup and push
        run: |
          set -e
          git rm -rq .buildtmp/pb
          git rm -q .github/workflows/tmp-apply-pb.yml
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "feat(meo): publish and unpublish GBP posts after human confirmation" -m "Posts are published only when a person presses the confirm button. Scheduled dates are recorded but never auto-published. Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
