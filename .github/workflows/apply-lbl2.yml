name: apply-lbl2
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-lbl2.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/lbl2/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "3df06ea364749d73eab713403a61b35fcb33d3fc3dbbf3d50d328b21c034a0e5  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/lbl2 .github/workflows/apply-lbl2.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "比較表：空欄の表示を「公式サイトで確認」から「確認できませんでした」にする" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
