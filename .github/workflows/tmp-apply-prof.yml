name: tmp-apply-prof
on:
  push:
    paths:
      - ".github/workflows/tmp-apply-prof.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged files and verify hash
        run: |
          set -e
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          cp -r .buildtmp/prof/files/. .
          for p in .buildtmp/prof/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          sha256sum -c .buildtmp/prof/SHA256SUMS
          rm -rf .buildtmp/prof
          rm -f .github/workflows/tmp-apply-prof.yml
          rmdir .buildtmp 2>/dev/null || true
          git add -A
          git commit -m "feat(meo): Googleプロフィールの更新（説明文・営業時間・Webサイト）を人の承認後に反映

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
