name: apply-cmp
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-cmp.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/cmp/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "36176ee69e091f84b93364b41cf2a5604a4aa86e77e413170f586d289168377c  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/cmp .github/workflows/apply-cmp.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "サテライト：記事ごとに比較表の下調べ（比較項目を決め、公式サイト・検索で各社の値を集めて人が確かめる）" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
