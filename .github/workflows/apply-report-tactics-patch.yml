name: apply-report-tactics-patch
on:
  push:
    paths:
      - ".buildtmp/report-tactics/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        run: |
          git apply --whitespace=nowarn .buildtmp/report-tactics/analysis.patch
          git apply --whitespace=nowarn .buildtmp/report-tactics/tactics.patch
          git apply --whitespace=nowarn .buildtmp/report-tactics/report.patch

      - name: Commit and push patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/analysis.ts lib/tactics.ts components/Report.tsx
          git commit -m "fix(report): レポート表記整理・広告以外の施策を表示・スケジュールに広告を反映・LP生成を非表示"
          git push

      - name: Remove temporary workflow and buildtmp files
        run: |
          git rm -f .github/workflows/apply-report-tactics-patch.yml
          git rm -rf .buildtmp/report-tactics
          git commit -m "chore: 一時ワークフローを削除"
          git push
