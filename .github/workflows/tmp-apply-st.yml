name: tmp-apply-st
on:
  push:
    paths:
      - '.github/workflows/tmp-apply-st.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches
        run: |
          set -e
          for p in 1 2 3 4; do git apply --verbose .buildtmp/st/patches/$p.patch; done
      - name: Verify hashes
        run: sha256sum -c .buildtmp/st/SHA256SUMS
      - name: Cleanup and push
        run: |
          set -e
          git rm -rq .buildtmp/st
          git rm -q .github/workflows/tmp-apply-st.yml
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "feat: AI search term is inferred from the business, not the Google category" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
