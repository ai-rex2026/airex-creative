name: apply-aiocite
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-aiocite.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          D=.buildtmp/aiocite
          cat $D/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/patch.diff
          sha256sum -c $D/patch.sha256
          git apply /tmp/patch.diff
          git rm -r -q .buildtmp/aiocite .github/workflows/apply-aiocite.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git add -A
          git commit -q -m "AIO：引用率を「自社サイトが AI の根拠に参照された割合」に揃え、紹介の根拠あり（他社媒体含む）を別に出す。媒体一覧に自社サイトを常に出す" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
