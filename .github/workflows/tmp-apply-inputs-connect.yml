name: tmp-apply-inputs-connect
on:
  push:
    paths:
      - ".buildtmp/inputs-connect/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git apply --whitespace=fix .buildtmp/inputs-connect/patch.diff
      - name: Clean up temp files and this workflow
        run: |
          rm -rf .buildtmp/inputs-connect
          rm -f .github/workflows/tmp-apply-inputs-connect.yml
      - name: Commit and push
        run: |
          git add -A
          git commit -m "feat: 入力タブにSNS連携ボタン（対応予定・グレーアウト）を追加 (temp workflow self-clean)"
          git push origin HEAD:main
