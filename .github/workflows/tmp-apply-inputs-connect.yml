name: tmp-apply-inputs-connect
on:
  push:
    paths:
      - ".buildtmp/inputs-connect/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Already applied directly - just clean up
        run: |
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          rm -rf .buildtmp/inputs-connect
          rm -f .github/workflows/tmp-apply-inputs-connect.yml
          git add -A
          git diff --cached --quiet || (git commit -m "chore: remove stale temp workflow (self-clean)" && git push origin HEAD:main)
