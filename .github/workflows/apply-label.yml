name: apply-label
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-label.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/label/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "7b14310015803b7fd7dd8eafd99b5a56a6a0d69943139f311a728a7c7ce22ecd  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/label .github/workflows/apply-label.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "サテライト：まとめて集めるボタンの文言を分かりやすくする" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
