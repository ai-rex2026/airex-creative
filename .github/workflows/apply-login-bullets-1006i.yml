name: apply-login-bullets-1006i
on:
  push:
    paths:
      - '.github/workflows/apply-login-bullets-1006i.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate chunks, decode, gunzip and apply patch
        run: |
          cat .buildtmp/login-bullets-1006i/chunks/chunk-*.b64 | tr -d '\n' > /tmp/combined.b64
          base64 -d /tmp/combined.b64 | gunzip > /tmp/combined.patch
          echo "3cdba54a1a40746129fbbd529659319abb2c20fecf5808023171bb35d39595f2  /tmp/combined.patch" | sha256sum -c -
          git apply --check /tmp/combined.patch
          git apply /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git add -A -- . ':!.buildtmp' ':!.github/workflows/apply-login-bullets-1006i.yml'
          git commit \
            -m "feat: ログイン画面・パスワード再設定画面の箇条書き3つを削除（1006i）" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"

      - name: Remove staging files and this workflow
        run: |
          git rm -r -q .buildtmp
          git rm -q .github/workflows/apply-login-bullets-1006i.yml
          git commit -m "chore: remove temporary push-apply workflow and staging files"

      - name: Push to main
        run: git push origin HEAD:main
