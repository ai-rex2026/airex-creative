name: apply-kick
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-kick.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          D=.buildtmp/kick
          cat $D/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/patch.diff
          sha256sum -c $D/patch.sha256
          git apply /tmp/patch.diff
          git rm -r -q .buildtmp/kick .github/workflows/apply-kick.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git add -A
          git commit -q -m "分析の1バースト目を本番ドメインのデプロイで動かす（画面が古いデプロイのままでも最新のコードで分析する）。公開広告の取得日時を時刻まで出す" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
