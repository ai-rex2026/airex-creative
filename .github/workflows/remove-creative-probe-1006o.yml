name: remove-creative-probe-1006o
on:
  push:
    paths:
      - '.github/workflows/remove-creative-probe-1006o.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove the temporary route and this workflow
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git rm -q app/api/dev/creative-probe/route.ts
          git rm -q .github/workflows/remove-creative-probe-1006o.yml
          git commit \
            -m "chore: 試験用の一時ルート（Meta広告の画像・動画分析）を削除" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
