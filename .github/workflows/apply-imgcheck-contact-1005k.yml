name: apply-imgcheck-contact-1005k
on:
  push:
    paths:
      - '.github/workflows/apply-imgcheck-contact-1005k.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concatenate chunks, decode, gunzip and apply patch
        run: |
          cat .buildtmp/imgcheck-contact-1005k/chunks/chunk-*.b64 | tr -d '\n' > /tmp/combined.b64
          base64 -d /tmp/combined.b64 | gunzip > /tmp/combined.patch
          echo "1fa7cb4e3b54f7f686d356256100195c1766dd4d69ef77aa179eedb860dee2b3  /tmp/combined.patch" | sha256sum -c -
          git apply --check /tmp/combined.patch
          git apply /tmp/combined.patch

      - name: Commit applied changes
        run: |
          git config user.name "suzuki"
          git config user.email "suzuki@ad-rex.com"
          git add -A -- . ':!.buildtmp' ':!.github/workflows/apply-imgcheck-contact-1005k.yml'
          git commit \
            -m "fix: 画像の文字チェックが0件で保存される不具合を修正・各章に問い合わせボタンを追加（1005k）" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"

      - name: Remove staging files and this workflow
        run: |
          git rm -r -q .buildtmp
          git rm -q .github/workflows/apply-imgcheck-contact-1005k.yml
          git commit -m "chore: remove temporary push-apply workflow and staging files"

      - name: Push to main
        run: git push origin HEAD:main
