name: apply-cmp3
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-cmp3.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/cmp3/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "befddd459e29e1f40f9b3bd40dcdc92d318d8270cef6881f99bf29bc124a96ac  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/cmp3 .github/workflows/apply-cmp3.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "比較表の下調べ：検索の出典が取れないときに再試行と Claude の Web 検索で補い、空欄の多い項目は既定で外す" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
