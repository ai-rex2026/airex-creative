name: apply-falerr
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-falerr.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: apply
        run: |
          set -e
          D=.buildtmp/falerr
          cat $D/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/patch.diff
          sha256sum -c $D/patch.sha256
          git apply /tmp/patch.diff
          git rm -r -q .buildtmp/falerr .github/workflows/apply-falerr.yml
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git add -A
          git commit -q -m "バナー制作：fal の 401・403 を分け、fal の理由（残高切れ・キーの誤り・権限）を画面に出す" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
