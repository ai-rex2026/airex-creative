name: apply-report-patch15
on:
  push:
    paths:
      - '.buildtmp/report15/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('.buildtmp/report15/escaped_p15.txt')
          content = json.loads(p.read_text(encoding='utf-8'))
          pathlib.Path('.buildtmp/report15/patch15.diff').write_text(content, encoding='utf-8')
          "
          git apply --whitespace=nowarn .buildtmp/report15/patch15.diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/Report.tsx lib/ad-ops.ts
          git commit -F .buildtmp/report15/commitmsg.txt
          git push origin HEAD:main

      - name: Remove temp workflow and buildtmp
        run: |
          git rm -r .github/workflows/apply-report-patch15.yml .buildtmp/report15
          git commit -m "chore: remove temp workflow (apply-report-patch15)

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
