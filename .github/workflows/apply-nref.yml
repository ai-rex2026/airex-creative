name: apply-nref
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-nref.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/nref/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "dceac5754f970717155af86efcb8352b71080675c490aec98c17b9222ac0643c  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/nref .github/workflows/apply-nref.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "AIO note：参考にする人気記事（週1回の検索でスキ数・見出しを読む＋人が貼る欄）を記事づくりに渡す" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
