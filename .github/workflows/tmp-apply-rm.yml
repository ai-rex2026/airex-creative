name: tmp-apply-rm
on:
  push:
    paths:
      - '.github/workflows/tmp-apply-rm.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove diagnostic route
        run: |
          set -e
          git rm -q app/api/debug/gemini/route.ts
          test ! -e app/api/debug/gemini/route.ts
      - name: Cleanup and push
        run: |
          set -e
          git rm -q .github/workflows/tmp-apply-rm.yml
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git commit -m "chore: remove temporary Gemini connection diagnostic route" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
