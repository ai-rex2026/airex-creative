name: apply-1014a
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-1014a.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/1014a/chunks/chunk-*.b64 | base64 -d | gunzip > /tmp/p.patch
          echo 'ce0877dc151a1c571a1dcde978495066a44b934276ab21722c3145590f287ad7  /tmp/p.patch' | sha256sum -c -
          git apply /tmp/p.patch
          git rm -rq .buildtmp .github/workflows/apply-1014a.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -F - <<'MSG'
          feat: データ削除の手順ページ（/data-deletion）を追加（Metaアプリのデータ削除URL用）

          chore: remove temporary push-apply workflow and staging files

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy
          MSG
          git push origin HEAD:main
