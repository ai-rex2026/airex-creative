name: apply-rep
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-rep.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -euo pipefail
          cat .buildtmp/rep/chunks/chunk-*.b64 | tr -d '\n\r ' | base64 -d | gunzip > /tmp/p.patch
          echo "566b19192ba5affc483ae19f86426179b92606f2da426f7b40ae5dfffc96639e  /tmp/p.patch" | sha256sum -c
          git apply /tmp/p.patch
          git rm -rq .buildtmp/rep .github/workflows/apply-rep.yml
          git add -A
          git config user.name suzuki
          git config user.email suzuki.yuichiro.libertad@gmail.com
          git commit -q -m "レポート：LINE Tag（旧仕様）を出さない、未実施か不明の施策は効果「中」以下、左メニューを「分析レポート作成履歴」に" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011jEDcQZVboNh2wrFzXQFmy"
          git push origin HEAD:main
