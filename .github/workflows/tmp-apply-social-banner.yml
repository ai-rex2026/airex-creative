name: tmp-apply-social-banner
on:
  push:
    paths:
      - ".buildtmp/social-banner/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git apply --whitespace=fix .buildtmp/social-banner/patch.diff
      - name: Clean up temp files and this workflow
        run: |
          rm -rf .buildtmp/social-banner
          rm -f .github/workflows/tmp-apply-social-banner.yml
      - name: Commit and push
        run: |
          git add -A
          git commit -m "apply social/banner changes (temp workflow self-clean)"
          git push origin HEAD:main
