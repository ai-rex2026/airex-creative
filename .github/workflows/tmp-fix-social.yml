name: tmp-fix-social
on:
  push:
    paths:
      - ".buildtmp/social-fix/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          git apply --whitespace=fix .buildtmp/social-fix/patch.diff
      - name: Clean up temp files and this workflow
        run: |
          rm -rf .buildtmp/social-fix
          rm -f .github/workflows/tmp-fix-social.yml
      - name: Commit and push
        run: |
          git add -A
          git commit -m "fix: social.ts の転記ミス2箇所を修正 (temp workflow self-clean)"
          git push origin HEAD:main
