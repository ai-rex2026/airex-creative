name: apply-report-patch13
on:
  push:
    paths:
      - '.buildtmp/report13/GO.marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          python3 -c "
          import json, pathlib
          base = pathlib.Path('.buildtmp/report13')
          parts = ['part1_esc.txt', 'part2a_esc.txt', 'part2b_esc.txt']
          content = ''
          for p in parts:
              content += json.loads((base / p).read_text(encoding='utf-8'))
          (base / 'patch13.diff').write_text(content, encoding='utf-8')
          "
          git apply --whitespace=nowarn .buildtmp/report13/patch13.diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/Report.tsx components/Inputs.tsx
          git commit -m "fix: サジェスト空表示・予算作り直しボタンの表示不整合を修正

          (1) scanSuggestsがエラー無しでrows:[]を返すケースで検索サジェスト章ごと
          非表示になっていたため、結果が無い場合も章自体は出し「検出されませんでした」
          と明示するよう変更。(2) 広告手法一覧の月間広告予算ピッカーと作り直しボタンは、
          押しても完了を検知する手段がなく「作り直しています…」の表記が終わらなかった。
          予算の変更・作り直しは入力タブに一本化し、広告手法一覧側は想定予算の表示と
          入力タブへのリンクのみに変更。入力タブ側の作り直しボタンにも、
          処理がバックグラウンドで続くことを示す案内文を追加した。

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main

      - name: Remove temp workflow and buildtmp
        run: |
          git rm -r .github/workflows/apply-report-patch13.yml .buildtmp/report13
          git commit -m "chore: remove temp workflow (apply-report-patch13)

          Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
