name: tmp-apply-jp
on:
  push:
    paths:
      - ".github/workflows/tmp-apply-jp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patches and verify hashes
        run: |
          set -e
          git config user.name "airex-bot"
          git config user.email "bot@ad-rex.com"
          for p in .buildtmp/jp/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          sha256sum -c .buildtmp/jp/SHA256SUMS
          rm -rf .buildtmp/jp
          rm -f .github/workflows/tmp-apply-jp.yml
          rmdir .buildtmp 2>/dev/null || true
          git add -A
          git commit -m "fix(meo): AI文章に混ざる中国語の簡体字を日本語の字に直す

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QtZhyn7JGprXAKzbAXZHW3"
          git push origin HEAD:main
