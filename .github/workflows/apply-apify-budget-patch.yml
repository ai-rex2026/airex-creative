name: apply-apify-budget-patch
on:
  push:
    paths:
      - ".buildtmp/apify-budget/GO.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        run: |
          git apply --whitespace=nowarn .buildtmp/apify-budget/social.patch
          git apply --whitespace=nowarn .buildtmp/apify-budget/social-comp.patch
          git apply --whitespace=nowarn .buildtmp/apify-budget/analysis.patch
          git apply --whitespace=nowarn .buildtmp/apify-budget/report.patch

      - name: Commit and push patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/social.ts lib/social-competitors.ts lib/analysis.ts components/Report.tsx
          git commit -m "fix: Apify呼び出し予算を自社実測/競合調査で共通化、コピー選択UIをバナー書き出しに移設"
          git push

      - name: Remove temporary workflow and buildtmp files
        run: |
          git rm -f .github/workflows/apply-apify-budget-patch.yml
          git rm -rf .buildtmp/apify-budget
          git commit -m "chore: remove temp workflow"
          git push
